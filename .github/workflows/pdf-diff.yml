name: Track PDF model changes

on:
  workflow_dispatch:
  pull_request:
  # Run on pushes to main and release branches to populate cache
  push:
    branches:
      - main
      - release-*

permissions:
  contents: read

env:
  TZ: "Europe/Amsterdam"

concurrency:
  group: pdf-diff-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  diff:
    name: Diff PDFs
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    env:
      CARGO_TERM_COLOR: always
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.base_ref || 'main' }}
      # The base ref may not have a rust-toolchain.toml yet, so fall back to stable.
      - name: Setup Rust
        shell: bash
        run: if [ -f rust-toolchain.toml ]; then rustup toolchain install; else rustup update stable && rustup default stable; fi
      - name: Cargo cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: "backend -> target"
          # Save cache only for main and release branches to prevent cache thrashing
          save-if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release-') }}
      - name: Generate PDFs
        run: cargo run --bin gen-pdf --features embed-typst -- --directory base
      # PDF diffing steps are skipped for push events: base and head are the same commit
      - name: Switch to current branch
        if: github.event_name != 'push'
        uses: actions/checkout@v7.0.1
        with:
          clean: false
      - name: Setup Rust for current branch
        if: github.event_name != 'push'
        run: rustup toolchain install
      - name: Generate PDFs on the current branch
        if: github.event_name != 'push'
        run: cargo run --bin gen-pdf --features embed-typst -- --directory head
      - name: Install diff-pdf
        if: github.event_name != 'push'
        run: sudo apt-get update && sudo apt-get install -y diff-pdf-wx
      - name: Generate PDF diff summary
        if: github.event_name != 'push'
        id: diff_summary
        uses: actions/github-script@v9
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        with:
          script: require('.github/workflows/scripts/pdf-diff.js').pdfDiff({ core });
      - name: Upload diff artifacts
        id: artifact-upload
        if: ${{ steps.diff_summary.outputs.diff_found == '1' }}
        uses: actions/upload-artifact@v7
        with:
          name: pdf-diffs
          path: backend/tmp-pdf-gen/diffs/
      - name: Add diff download link to job summary
        if: ${{ steps.diff_summary.outputs.diff_found == '1' }}
        run: |
          url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts/${{ steps.artifact-upload.outputs.artifact-id }}"
          echo "[Download ZIP file containing PDF files with the visual differences]($url)" >> "$GITHUB_STEP_SUMMARY"
