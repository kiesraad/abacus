name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

jobs:
  build:
    name: Release build
    permissions:
      contents: read
      attestations: write
      id-token: write
    uses: ./.github/workflows/release-build.yml
    with:
      version: ${{ github.ref_name }}
      attest: true

  release:
    name: Release
    needs:
      - build
    runs-on: ubuntu-latest
    permissions:
      # contents write permission is needed to push create a release
      # https://docs.github.com/en/rest/releases/releases?apiVersion=2022-11-28#create-a-release
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Get build date
        run: |
          BUILD_DATE=$(date -u +'%Y-%m-%d')
          echo "BUILD_DATE=$BUILD_DATE" >> "$GITHUB_ENV"
      - name: Create release directory
        run: mkdir -p release
      # The Linux tarball, the Windows binary and the unsigned Windows installer
      - name: Download abacus
        uses: actions/download-artifact@v8
        with:
          pattern: abacus-release-*
          path: release/
          merge-multiple: true
      - name: Rename Windows binary and installer
        run: |
          mv abacus.exe abacus-windows-${{ github.ref_name }}.exe
          mv abacussetup.exe abacus-windows-setup-${{ github.ref_name }}-unsigned.exe
        working-directory: release
      - name: Create a SHA256SUMS file
        run: sha256sum -b -- * > SHA256SUMS
        working-directory: release
      - name: Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v2
        with:
          body: This is a release of Abacus ${{ github.ref_name }}, commit ${{ github.sha }} on ${{ env.BUILD_DATE }}
          tag_name: ${{ github.ref_name }}
          prerelease: false
          draft: true
          target_commitish: "${{ github.sha }}"
          files: release/*
          token: ${{ secrets.GITHUB_TOKEN }}
          name: Version ${{ github.ref_name }}

  deploy:
    if: github.repository == 'kiesraad/abacus'
    name: Deploy to abacus-test.nl, without airgap detection
    needs:
      - build
      - release
    environment:
      name: release
      url: https://${{ github.sha }}.abacus-test.nl
    permissions:
      contents: read
      deployments: write
    runs-on: ubuntu-latest
    steps:
      - name: Download abacus
        uses: actions/download-artifact@v8
        with:
          name: abacus-ubuntu-latest-no-airgap-detection
      - name: Upload binary to test server
        run: |
          curl -s -v \
          --fail \
          -H "Authorization: Bearer ${{ secrets.ABACUS_TEST_API_KEY }}" \
          -T ./abacus \
          https://abacus-test.nl/etes/api/v1/executable/${{ github.sha }}/${{ github.sha }}
