name: Verify Actions lockfile

# Fails when .github/workflows/actions.lock is out of sync with the workflows,
# or when a locked commit no longer matches its upstream tag.
# To fix: run `gh actions-lock` locally (gh extension install github/gh-actions-lock)
# and commit the changed workflows and lockfile. Never edit the lockfile by hand.
on:
  workflow_dispatch:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches:
      - main
      - release-*

permissions:
  contents: read

concurrency:
  group: verify-lockfile-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify lockfile
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install gh-actions-lock
        run: gh extension install github/gh-actions-lock --pin v0.4.1
      - name: Verify lockfile
        run: gh actions-lock --verify
