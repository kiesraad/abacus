name: Weekly end-to-end tests

on:
    workflow_dispatch:
    # Run every Monday at 05:00 UTC
    schedule:
        - cron: "0 5 * * 1"

permissions:
  contents: read

jobs:
  release-build:
    name: Release build
    permissions:
      contents: read
      attestations: write
      id-token: write
    uses: ./.github/workflows/release-build.yml
    with:
      version: weekly-${{ github.run_number }}
      # Only attest builds of main and release branches, not of arbitrary branches run manually
      attest: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release-') }}
