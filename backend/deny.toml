[graph]
targets = [
    { triple = "x86_64-unknown-linux-musl" },
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "aarch64-unknown-linux-gnu" },
    { triple = "x86_64-pc-windows-msvc" },
    { triple = "aarch64-apple-darwin" },
    { triple = "x86_64-apple-darwin" },
]

all-features = true

[licenses]
version = 2
private = { ignore = true }
allow = [
    "0BSD",
    "Apache-2.0 WITH LLVM-exception",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "EUPL-1.2",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]

[bans]
deny = [
    { crate = "openssl", use-instead = "rustls" },
    { crate = "openssl-sys", use-instead = "rustls" },
    { crate = "ring", use-instead = "aws-lc-rs" },
    { crate = "rsa", use-instead = "aws-lc-rs" },
]
multiple-versions = "allow"

[advisories]
yanked = "deny"
ignore = [
    # Typst
    { id = "RUSTSEC-2024-0320", reason = "yaml-rust is unmaintained, used via syntect; fixed on syntect main (yaml-rust2), not released yet, see https://github.com/trishume/syntect/issues/537" },
    { id = "RUSTSEC-2024-0436", reason = "paste is unmaintained, used via biblatex and hayagriva; no fix upstream yet, see https://github.com/typst/biblatex/issues/87" },
    { id = "RUSTSEC-2024-0449", reason = "unsafe-libyaml is unmaintained, used via serde_yaml (hayagriva, typst-library); fixed on hayagriva main, not released yet, see https://github.com/typst/hayagriva/pull/502" },
    { id = "RUSTSEC-2025-0141", reason = "bincode is unmaintained, used via syntect; no fix upstream yet, see https://github.com/trishume/syntect/issues/606" },
    { id = "RUSTSEC-2026-0194", reason = "quick-xml <0.41 has a DoS (quadratic duplicate-attribute check), used via citationberg; fixed on citationberg main, not released yet, see https://github.com/tafia/quick-xml/issues/969" },
    { id = "RUSTSEC-2026-0195", reason = "quick-xml <0.41 has a DoS (unbounded namespace-declaration allocation), used via citationberg; fixed on citationberg main, not released yet, see https://github.com/tafia/quick-xml/issues/969" },
    { id = "RUSTSEC-2026-0206", reason = "rustybuzz is unmaintained (successor: harfrust), used via typst-layout, typst-library, krilla and usvg; no fix upstream yet, see https://github.com/harfbuzz/rustybuzz/issues/166" },
    # Typst, and a direct dependency of abacus
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser is unmaintained, used directly and via Typst; no fix upstream yet, see https://github.com/kiesraad/abacus/issues/3849" },
    # sqlx
    { id = "RUSTSEC-2026-0459", reason = "bundled SQLite <3.54 has a vulnerability, used via libsqlite3-sys 0.37; fixed on sqlx main (allows libsqlite3-sys 0.39), not released yet; Abacus only opens its own database, see https://github.com/kiesraad/abacus/issues/4276" },
]
